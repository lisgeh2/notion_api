name: hangout sync

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 8 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
    - cron: "17 19 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests icalendar recurring-ical-events python-dotenv

      - run: python show_calendar.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URL_TODO: ${{ secrets.ICS_URL_TODO }}
